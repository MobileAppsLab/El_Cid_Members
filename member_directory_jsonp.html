<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Cid MGA Members</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:15px}
.container{max-width:800px;margin:auto}
h1{text-align:center;margin:5px 0 15px}
#search{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:1px solid #ccc;border-radius:8px;margin-bottom:15px}
.member{background:white;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.name{font-size:18px;font-weight:bold;margin-bottom:10px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.buttons a{text-align:center;text-decoration:none;color:white;padding:10px 5px;border-radius:8px;font-size:15px}
.email{background:#1976d2}.text{background:#555}.call{background:#2e7d32}.whatsapp{background:#25D366}
.disabled{opacity:.45;pointer-events:none}
#status{text-align:center;padding:20px;color:#666}
@media(max-width:520px){.buttons{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<h1>El Cid MGA Members</h1>
<input id="search" type="search" placeholder="Search by first or last name...">
<div id="status">Loading members...</div>
<div id="members"></div>
</div>
<script>
const DATA_URL="https://script.google.com/macros/s/AKfycbxv1r1AgwFSlyqkgy_cMfYh5muiHxEF1IwzsFc2w8El1YCsR8_zseB4N8NnUj75iiGZQg/exec";
let members=[];
function loadMembers(){
 const callbackName="loadMembersCallback_"+Date.now();
 window[callbackName]=function(data){
  try{
   if(!Array.isArray(data))throw new Error("Invalid member data");
   members=data.slice(1).map(row=>({
    last:String(row[0]??"").trim(),
    first:String(row[1]??"").trim(),
    email:String(row[2]??"").trim(),
    phone:String(row[9]??"").trim()
   })).filter(m=>m.last||m.first);
   delete window[callbackName];
   const s=document.getElementById(callbackName);if(s)s.remove();
   document.getElementById("status").textContent="";
   renderMembers();
  }catch(e){showError();}
 };
 const script=document.createElement("script");
 script.id=callbackName;
 script.src=DATA_URL+"?callback="+encodeURIComponent(callbackName);
 script.onerror=function(){delete window[callbackName];script.remove();showError()};
 document.body.appendChild(script);
}
function showError(){document.getElementById("status").textContent="The member data could not be loaded. Please check the Apps Script deployment."}
function renderMembers(){
 const search=document.getElementById("search").value.trim().toLowerCase();
 const container=document.getElementById("members");
 const filtered=members.filter(m=>!search||m.first.toLowerCase().includes(search)||m.last.toLowerCase().includes(search));
 if(!filtered.length){container.innerHTML='<div class="member">No members found.</div>';return}
 container.innerHTML=filtered.map(m=>{
  const phone=m.phone.replace(/[^\d+]/g,"");
  const whatsappNumber=m.phone.replace(/\D/g,"");
  const emailButton=m.email?`<a class="email" href="mailto:${encodeURIComponent(m.email)}">✉ Email</a>`:`<a class="email disabled" href="#">✉ Email</a>`;
  const textButton=phone?`<a class="text" href="sms:${phone}">💬 Text</a>`:`<a class="text disabled" href="#">💬 Text</a>`;
  const callButton=phone?`<a class="call" href="tel:${phone}">☎ Call</a>`:`<a class="call disabled" href="#">☎ Call</a>`;
  const whatsappButton=whatsappNumber?`<a class="whatsapp" href="https://wa.me/${whatsappNumber}">🟢 WhatsApp</a>`:`<a class="whatsapp disabled" href="#">🟢 WhatsApp</a>`;
  return `<div class="member"><div class="name">${escapeHtml(m.last)}, ${escapeHtml(m.first)}</div><div class="buttons">${emailButton}${textButton}${callButton}${whatsappButton}</div></div>`;
 }).join("");
}
function escapeHtml(value){return value.replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]))}
document.getElementById("search").addEventListener("input",renderMembers);
loadMembers();
</script>
</body>
</html>
