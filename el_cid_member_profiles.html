<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Cid Member Profiles</title>
<style>body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:15px}
.container{max-width:800px;margin:auto}
h1{text-align:center;margin:5px 0 15px}
#search{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:1px solid #ccc;border-radius:8px;margin-bottom:15px}
.member{background:white;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.name{font-size:19px;font-weight:bold;margin-bottom:12px;color:#176b3a}
.profile{display:grid;grid-template-columns:140px 1fr;gap:7px 12px;font-size:15px}
.label{font-weight:bold;color:#666}
.value{color:#222;overflow-wrap:anywhere}
#status{text-align:center;padding:20px;color:#666}
@media(max-width:520px){.profile{grid-template-columns:115px 1fr;font-size:14px}}
</style>
</head>
<body>
<div class="container">
<h1>El Cid Member Profiles</h1>
<input id="search" type="search" placeholder="Search by first or last name...">
<div id="status">Loading members...</div>
<div id="members"></div>
</div>
<script>
const DATA_URL="https://script.google.com/macros/s/AKfycbxv1r1AgwFSlyqkgy_cMfYh5muiHxEF1IwzsFc2w8El1YCsR8_zseB4N8NnUj75iiGZQg/exec";
let members=[];
function loadMembers(){
 const callbackName="loadMembersCallback_"+Date.now();
 window[callbackName]=function(data){
  try{
   if(!Array.isArray(data))throw new Error("Invalid member data");
   members=data.slice(1).map(row=>({
    last:String(row[0]??"").trim(),
    first:String(row[1]??"").trim(),
    email:String(row[2]??"").trim(),
    handicap:String(row[3]??"").trim(),
    street:String(row[4]??"").trim(),
    city:String(row[5]??"").trim(),
    state:String(row[6]??"").trim(),
    zip:String(row[7]??"").trim(),
    country:String(row[8]??"").trim(),
    phone:String(row[9]??"").trim(),
    cellPhone:String(row[10]??"").trim(),
    canadaUsPhone:String(row[11]??"").trim()
   })).filter(m=>m.last||m.first);
   delete window[callbackName];
   const script=document.getElementById(callbackName);
   if(script)script.remove();
   document.getElementById("status").textContent="";
   renderMembers();
  }catch(e){showError();}
 };
 const script=document.createElement("script");
 script.id=callbackName;
 script.src=DATA_URL+"?callback="+encodeURIComponent(callbackName);
 script.onerror=function(){delete window[callbackName];script.remove();showError()};
 document.body.appendChild(script);
}

function showError(){
 document.getElementById("status").textContent="The member data could not be loaded. Please check the Apps Script deployment.";
}

function renderMembers(){
 const search=document.getElementById("search").value.trim().toLowerCase();
 const container=document.getElementById("members");
 const filtered=members.filter(m=>{
  if(!search)return true;
  return [m.first,m.last,m.email,m.handicap,m.street,m.city,m.state,m.zip,m.country,m.phone,m.cellPhone,m.canadaUsPhone]
   .some(v=>v.toLowerCase().includes(search));
 });
 if(!filtered.length){container.innerHTML='<div class="member">No members found.</div>';return}
 container.innerHTML=filtered.map(m=>{
  const fullName=[m.last,m.first].filter(Boolean).join(", ");
  return `
   <div class="member">
    <div class="name">${escapeHtml(fullName)}</div>
    <div class="profile">
     <div class="label">Email</div><div class="value">${display(m.email)}</div>
     <div class="label">Handicap</div><div class="value">${display(m.handicap)}</div>
     <div class="label">Street</div><div class="value">${display(m.street)}</div>
     <div class="label">City</div><div class="value">${display(m.city)}</div>
     <div class="label">State / Province</div><div class="value">${display(m.state)}</div>
     <div class="label">ZIP / Postal</div><div class="value">${display(m.zip)}</div>
     <div class="label">Country</div><div class="value">${display(m.country)}</div>
     <div class="label">Phone</div><div class="value">${display(m.phone)}</div>
     <div class="label">Cell Phone</div><div class="value">${display(m.cellPhone)}</div>
     <div class="label">Canada/US Phone</div><div class="value">${display(m.canadaUsPhone)}</div>
    </div>
   </div>`;
 }).join("");
}

function display(value){return value?escapeHtml(value):"—";}

function escapeHtml(value){return value.replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]))}
document.getElementById("search").addEventListener("input",renderMembers);
loadMembers();
</script>
</body>
</html>
